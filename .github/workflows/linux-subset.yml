# Interim Linux CI for the crates that already build without Windows.
# Superseded once full-workspace Linux CI lands; fold or delete then.
#
# Every step here passes on plain Linux with no Windows SDK, no cross target
# and no game data. The PR that added this lists the same commands for local use.
name: linux-subset

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# An explicit `shell: bash` runs scripts as `bash --noprofile --norc -eo
# pipefail`; the implicit default is plain `bash -e`, where a failing command
# on the left of a pipe (e.g. the `echo ... | sha256sum -c -` checksum checks)
# is ignored. Set it once so every `run:` script gets pipefail.
defaults:
  run:
    shell: bash

# Actions are pinned to full commit SHAs (tag in the trailing comment): a tag
# can be moved to other code, a commit cannot. Bump both together.

# A newer push to a PR cancels its older run. Runs on main are never
# cancelled: only main saves the rust-cache, so a cancelled main run would
# leave PRs restoring a stale cache.
concurrency:
  group: linux-subset-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # A failing test or build script prints where it panicked.
  RUST_BACKTRACE: 1
  # Folded package lists are read into Bash arrays of Cargo arguments.
  # Crates (plus xtask) that build, test and are clippy-clean on Linux today.
  LINUX_CRATES: >-
    -p victory-core -p victory-pe -p victory-formats -p victory-pipeline
    -p victory-game -p victory-loader -p victory-shader -p xtask
  # Crates that are clippy-clean for the Windows target today.
  WINDOWS_CLIPPY_CRATES: >-
    -p victory-core -p victory-pe -p victory-formats -p victory-pipeline
    -p victory-game -p victory-loader -p victory-shader -p victory-gpu
  # Packages that are rustfmt-clean today. The rest (victory-formats,
  # victory-loader, victory-gpu, victory-hle) are not yet; add each one
  # once it is, and switch to `cargo fmt --all --check` when all are.
  RUSTFMT_CRATES: >-
    -p victory-core -p victory-pe -p victory-pipeline -p victory-game
    -p victory-shader -p victory -p xtask
  # Crates whose rustdoc builds with no warnings on Linux today (broken or
  # private intra-doc links, bad code-block attributes, ...). victory-formats
  # and victory-loader are not yet; add each one once it is.
  RUSTDOC_CRATES: >-
    -p victory-core -p victory-pe -p victory-pipeline -p victory-game
    -p victory-shader -p victory-gpu -p xtask
  # Crates whose rustdoc builds with no warnings for the Windows target, where
  # cfg(windows) items (all of victory-hle, apps/victory's host) exist and the
  # Linux rustdoc step never sees them. victory-formats and victory-loader
  # are not clean yet; add each one once it is.
  WINDOWS_RUSTDOC_CRATES: >-
    -p victory-core -p victory-pe -p victory-pipeline -p victory-game
    -p victory-hle -p victory-shader -p victory-gpu -p victory

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Nothing here pushes; keep the token out of .git/config.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # rustup is preinstalled; this installs the toolchain pinned in
      # rust-toolchain.toml (with clippy and rustfmt).
      - name: Install pinned toolchain
        run: rustup toolchain install

      # Save the cache only from main: PR runs restore it but do not write
      # their own entries, which would evict main's from the 10 GB quota.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Asset policy
        run: cargo xtask policy

      # Lints all workflows: expression and context typos, unknown keys, and
      # (via the runner's preinstalled shellcheck) the `run:` scripts, which
      # YAML parsing alone never checks. The release is pinned and its
      # checksum verified, like the actions above.
      # actionlint silently skips the shell checks when shellcheck is not on
      # PATH, so a runner image without it would pass every `run:` script
      # unchecked. Fail instead, and pass the binary explicitly so the check
      # cannot be dropped by a PATH change. pyflakes is off: no step runs Python.
      # SHELLCHECK_OPTS turns on ShellCheck's optional checks (masked return
      # codes, `set -e` suppressed in functions, unassigned uppercase vars,
      # `[[ ]]` over `[ ]`, ...) for the `run:` scripts. All of them pass
      # today but require-variable-braces (SC2250), which is style only.
      - name: actionlint
        env:
          SHELLCHECK_OPTS: >-
            --enable=add-default-case,avoid-nullary-conditions,check-extra-masked-returns,check-set-e-suppressed,check-unassigned-uppercase,deprecate-which,quote-safe-variables,require-double-brackets
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          if ! shellcheck_bin="$(command -v shellcheck)"; then
            echo "::error::shellcheck is not installed; actionlint would skip the run: scripts"
            exit 1
          fi
          "$shellcheck_bin" --version
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfL --retry 3 -O "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar xzf "$tarball" actionlint
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/actionlint" -color -shellcheck="$shellcheck_bin" -pyflakes=

      # Security audit of the workflows, which actionlint does not do:
      # template injection in `run:` scripts, credentials persisted by
      # checkout, over-broad permissions, cache poisoning, unpinned actions.
      # With the job's read-only token it also checks online that each pinned
      # SHA really is a commit of the action's repository (impostor commits)
      # and that no pinned version has a known advisory. Pinned and
      # checksum-verified like actionlint; exits non-zero on any finding.
      - name: zizmor
        env:
          ZIZMOR_VERSION: 1.32.0
          ZIZMOR_SHA256: bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b
          GH_TOKEN: ${{ github.token }}
        run: |
          tarball="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfL --retry 3 -O "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/${tarball}"
          echo "${ZIZMOR_SHA256}  ${tarball}" | sha256sum -c -
          tar xzf "$tarball" zizmor
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/zizmor" --color=always .github/workflows

      # Fast, needs no build: keep the clean packages clean. load_probe.rs is
      # checked by itself, since the rest of victory-loader is not clean yet.
      - name: rustfmt (clean packages)
        run: |
          read -r -a crates <<< "$RUSTFMT_CRATES"
          cargo fmt --check "${crates[@]}"
          rustfmt --check --edition 2024 crates/victory-loader/tests/load_probe.rs

      - name: clippy (all targets)
        run: |
          read -r -a crates <<< "$LINUX_CRATES"
          cargo clippy --all-targets --locked "${crates[@]}" -- -D warnings

      # The steps above build default features only, so code behind the
      # `diagnostics` (and victory-shader's `host`) features is never compiled.
      # Lint it too. Both builds stay: some code is cfg(not(feature = ...)).
      - name: clippy (all features)
        run: |
          read -r -a crates <<< "$LINUX_CRATES"
          cargo clippy --all-targets --all-features --locked "${crates[@]}" -- -D warnings

      # Doc tests run under `cargo test` below, but rustdoc's own lints (a
      # renamed item leaving a dangling [`link`], a public doc linking to a
      # private item) only fire when the docs are built. Private items are
      # documented too, so their doc comments (most of the code's) are linted
      # as well; a public doc linking to a private item still fails. The
      # second run turns every feature on, so the doc comments on `diagnostics`
      # (and victory-shader's `host`) code are linted too.
      - name: rustdoc (clean crates)
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          read -r -a crates <<< "$RUSTDOC_CRATES"
          cargo doc --no-deps --locked --document-private-items "${crates[@]}"
          cargo doc --no-deps --locked --document-private-items --all-features "${crates[@]}"

      # The skipped tests parse the test executable itself as a PE image, which
      # is an ELF on Linux. They still run on Windows. Once the workspace's
      # Linux gates land they are cfg(windows) and these --skip flags are no-ops.
      # --no-fail-fast: report failures from every test binary, not the first.
      - name: cargo test
        run: |
          read -r -a crates <<< "$LINUX_CRATES"
          cargo test --locked --no-fail-fast "${crates[@]}" -- --exact \
            --skip image::tests::parses_own_test_binary \
            --skip image::tests::rva_to_file_offset_maps_entry_point \
            --skip image::tests::rva_to_file_offset_rejects_offsets_past_4_gib \
            --skip image::tests::rejects_iat_outside_image \
            --skip prepare::tests::patches_own_test_binary \
            --skip prepare::tests::keeps_iat_slots_when_import_size_excludes_the_terminator \
            --skip prepare::tests::file_name_is_stable_per_build

  # Type-checks the Windows build from Linux: no MSVC, no linking, nothing runs.
  # Catches compile errors in cfg(windows) code (most of victory-gpu,
  # victory-hle and apps/victory, and the Windows-only tests) that the job
  # above never compiles.
  windows-target-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # blake3's build script compiles C/assembly with MSVC tools for this
      # target. Its build script reads this variable to select the pure-Rust
      # implementation; nothing is linked here, so the choice has no effect.
      CARGO_FEATURE_PURE: "1"
      # rustc warnings (unused imports, dead code, ...) fail every step,
      # including the workspace-wide `cargo check` ones. Set for the whole job
      # so all steps share one build.
      # Dependencies are unaffected: cargo caps their lints.
      RUSTFLAGS: -D warnings
    steps:
      # Nothing here pushes; keep the token out of .git/config.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # rust-toolchain.toml already lists the x86_64-pc-windows-msvc target.
      - name: Install pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows-target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo check (workspace, all targets)
        run: cargo check --locked --workspace --all-targets --target x86_64-pc-windows-msvc

      - name: clippy (Windows target, clean crates)
        run: |
          read -r -a crates <<< "$WINDOWS_CLIPPY_CRATES"
          cargo clippy --locked --all-targets --target x86_64-pc-windows-msvc "${crates[@]}" -- -D warnings

      # victory-hle and apps/victory are clippy-clean for Windows but for one
      # field_reassign_with_default in victory-hle's xmem.rs (fixed in open
      # PRs #355/#405). Lint them with only that lint allowed, so nothing else
      # regresses meanwhile; once it is fixed, drop the -A and move both into
      # WINDOWS_CLIPPY_CRATES. Both feature sets: the `diagnostics` code here
      # is cfg(windows).
      - name: clippy (Windows target, victory-hle and apps/victory)
        run: |
          cargo clippy --locked --all-targets --target x86_64-pc-windows-msvc -p victory-hle -p victory -- -D warnings -A clippy::field_reassign_with_default
          cargo clippy --locked --all-targets --all-features --target x86_64-pc-windows-msvc -p victory-hle -p victory -- -D warnings -A clippy::field_reassign_with_default

      # Same as the two steps above with every feature on, so the
      # `diagnostics` code (frame capture, the host debug layer, scripted keys,
      # mostly cfg(windows)) is compiled and linted too. Both builds stay: some
      # code is cfg(not(feature = "diagnostics")).
      - name: cargo check + clippy (Windows target, all features)
        run: |
          read -r -a crates <<< "$WINDOWS_CLIPPY_CRATES"
          cargo check --locked --workspace --all-targets --all-features --target x86_64-pc-windows-msvc
          cargo clippy --locked --all-targets --all-features --target x86_64-pc-windows-msvc "${crates[@]}" -- -D warnings

      # The hle-probe fixture is outside the workspace (load_probe builds it on
      # demand on Windows), so the steps above never compile it. It is
      # Windows-only and needs no linker to check. It cannot inherit the
      # workspace lints, so its Cargo.toml repeats them (SAFETY comments etc.).
      - name: clippy (hle-probe fixture, Windows target)
        run: >
          cargo clippy --locked --all-targets --target x86_64-pc-windows-msvc
          --manifest-path tests/fixtures/hle-probe/Cargo.toml -- -D warnings

      # Same rustdoc lints as the Linux job (private items included), but for
      # the Windows-only code it never compiles, plus the hle-probe fixture.
      # Nothing is linked; RUSTFLAGS above is unchanged, so the dependency
      # builds are shared with the steps above. The all-features run covers
      # the docs on the `diagnostics` code, which is mostly cfg(windows).
      - name: rustdoc (Windows target, clean crates)
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          read -r -a crates <<< "$WINDOWS_RUSTDOC_CRATES"
          cargo doc --no-deps --locked --document-private-items --target x86_64-pc-windows-msvc "${crates[@]}"
          cargo doc --no-deps --locked --document-private-items --all-features --target x86_64-pc-windows-msvc "${crates[@]}"
          cargo doc --no-deps --locked --document-private-items --target x86_64-pc-windows-msvc --manifest-path tests/fixtures/hle-probe/Cargo.toml

      # The fixture is outside the workspace, so `cargo fmt --all` never reaches
      # it. It is rustfmt-clean today; keep it that way. (The workspace itself
      # is not rustfmt-clean on main yet, so it is not checked here.)
      - name: rustfmt (hle-probe fixture)
        run: cargo fmt --check --manifest-path tests/fixtures/hle-probe/Cargo.toml
