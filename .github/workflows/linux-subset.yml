# Interim Linux CI for the crates that already build without Windows.
# Superseded once full-workspace Linux CI lands; fold or delete then.
#
# Every step here passes on plain Linux with no Windows SDK, no cross target
# and no game data. The PR that added this lists the same commands for local use.
name: linux-subset

on:
  push:
    branches: [main]
  pull_request:

# No token permissions by default; each job grants only what it uses, so a
# job added later starts with none instead of inheriting these.
permissions: {}

# The implicit default shell is plain `bash -e`, where a failing command on
# the left of a pipe (e.g. the `echo ... | sha256sum -c -` checksum checks)
# is ignored. Set it once so every `run:` script gets pipefail, plus nounset:
# a misspelt or missing variable (say a renamed *_CRATES list) is an error
# instead of expanding to nothing, which would e.g. run `cargo clippy` with
# no -p flags on whatever the default members are. inherit_errexit makes
# `set -e` apply inside command substitutions too, which Bash otherwise
# resets there: a failing command in `x="$(a; b)"` stops the step instead
# of letting `b` run on.
defaults:
  run:
    shell: bash --noprofile --norc -O inherit_errexit -euo pipefail {0}

# Actions are pinned to full commit SHAs (tag in the trailing comment): a tag
# can be moved to other code, a commit cannot. Bump both together.

# A newer push to a PR cancels its older run. Runs on main are never
# cancelled: only main saves the rust-cache, so a cancelled main run would
# leave PRs restoring a stale cache.
concurrency:
  group: linux-subset-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # A failing test or build script prints where it panicked.
  RUST_BACKTRACE: 1
  # Folded package lists are read into Bash arrays of Cargo arguments.
  # Crates (plus xtask) that build, test and are clippy-clean on Linux today.
  LINUX_CRATES: >-
    -p victory-core -p victory-pe -p victory-formats -p victory-pipeline
    -p victory-game -p victory-loader -p victory-shader -p xtask
  # Crates that are clippy-clean for the Windows target today: every
  # workspace member but xtask, which is host-only.
  WINDOWS_CLIPPY_CRATES: >-
    -p victory-core -p victory-pe -p victory-formats -p victory-pipeline
    -p victory-game -p victory-loader -p victory-shader -p victory-gpu
    -p victory-hle -p victory
  # Packages that are rustfmt-clean today. The rest (victory-formats,
  # victory-loader, victory-gpu, victory-hle) are not yet; add each one
  # once it is, and switch to `cargo fmt --all --check` when all are.
  RUSTFMT_CRATES: >-
    -p victory-core -p victory-pe -p victory-pipeline -p victory-game
    -p victory-shader -p victory -p xtask
  # Crates whose rustdoc builds with no warnings on Linux (broken or private
  # intra-doc links, bad code-block attributes, ...): LINUX_CRATES plus
  # victory-gpu, whose docs build on Linux although its code does not.
  RUSTDOC_CRATES: >-
    -p victory-core -p victory-pe -p victory-formats -p victory-pipeline
    -p victory-game -p victory-loader -p victory-shader -p victory-gpu
    -p xtask
  # Crates whose rustdoc builds with no warnings for the Windows target, where
  # cfg(windows) items (all of victory-hle, apps/victory's host) exist and the
  # Linux rustdoc step never sees them. Every workspace member but the
  # host-only xtask, like WINDOWS_CLIPPY_CRATES.
  WINDOWS_RUSTDOC_CRATES: >-
    -p victory-core -p victory-pe -p victory-formats -p victory-pipeline
    -p victory-game -p victory-loader -p victory-shader -p victory-gpu
    -p victory-hle -p victory

jobs:
  # Each job's name repeats its id, so the check names that branch protection
  # requires stay `linux` and `windows-target-check`; zizmor's auditor
  # persona (below) flags unnamed jobs.
  # Both jobs pin the runner image's Ubuntu release rather than
  # `ubuntu-latest`, like the action and tool pins: the alias moves to a new
  # release (new preinstalled rustup, curl, tar, coreutils, ...) under us, so
  # a passing PR could fail on main with no change. Bump it deliberately.
  linux:
    name: linux
    runs-on: ubuntu-24.04
    # checkout, plus zizmor's online audits (impostor commits, advisories).
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      # Nothing here pushes; keep the token out of .git/config.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # rustup is preinstalled; this installs the toolchain pinned in
      # rust-toolchain.toml (with clippy and rustfmt). --no-self-update keeps
      # the runner image's rustup as is: otherwise rustup replaces itself
      # with whatever release is newest that day, unpinned and mid-job.
      - name: Install pinned toolchain
        run: rustup toolchain install --no-self-update

      # Save the cache only from main: PR runs restore it but do not write
      # their own entries, which would evict main's from the 10 GB quota.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Spelled out rather than the `cargo xtask` alias (`run --package xtask
      # --`), which has no room for --locked: this is the job's first cargo
      # command, and without it a Cargo.lock out of date with the manifests
      # would be rewritten here, so every later `--locked` step would check
      # against the rewritten file and pass.
      - name: Asset policy
        run: cargo run --locked --quiet --package xtask -- policy

      # The crate lists above are written out by hand, so a workspace member
      # added later would silently get no clippy or rustdoc at all. Fail
      # instead: every member but the host-only xtask must be in both Windows
      # lists (which say they hold every member but xtask), and xtask, which
      # nothing else lints, must be in LINUX_CRATES. Every LINUX_CRATES crate
      # must also be in RUSTDOC_CRATES (which says it holds them all), so one
      # moved onto Linux CI gets its rustdoc lints too. Lists may still name
      # fewer crates on purpose (LINUX_CRATES, RUSTFMT_CRATES, ...).
      - name: Crate lists cover the workspace
        run: |
          metadata="$(cargo metadata --locked --no-deps --format-version 1)"
          names="$(jq -r '.packages[].name' <<< "${metadata}")"
          mapfile -t members <<< "${names}"
          if [[ "${#members[@]}" -lt 2 ]]; then
            echo "::error::cargo metadata listed no workspace members" >&2
            exit 1
          fi
          declare -A linux=() clippy=() rustdoc=() linux_rustdoc=()
          read -r -a args <<< "${LINUX_CRATES}"
          for a in "${args[@]}"; do linux["${a}"]=1; done
          read -r -a args <<< "${RUSTDOC_CRATES}"
          for a in "${args[@]}"; do linux_rustdoc["${a}"]=1; done
          read -r -a args <<< "${WINDOWS_CLIPPY_CRATES}"
          for a in "${args[@]}"; do clippy["${a}"]=1; done
          read -r -a args <<< "${WINDOWS_RUSTDOC_CRATES}"
          for a in "${args[@]}"; do rustdoc["${a}"]=1; done
          missing=0
          read -r -a args <<< "${LINUX_CRATES}"
          for c in "${args[@]}"; do
            if [[ "${c}" != -p && ! -v linux_rustdoc["${c}"] ]]; then
              echo "::error::LINUX_CRATES member ${c} is not in RUSTDOC_CRATES" >&2
              missing=1
            fi
          done
          for m in "${members[@]}"; do
            if [[ "${m}" == xtask ]]; then
              if [[ ! -v linux["${m}"] ]]; then
                echo "::error::xtask is not in LINUX_CRATES" >&2
                missing=1
              fi
              continue
            fi
            if [[ ! -v clippy["${m}"] ]]; then
              echo "::error::workspace member ${m} is not in WINDOWS_CLIPPY_CRATES" >&2
              missing=1
            fi
            if [[ ! -v rustdoc["${m}"] ]]; then
              echo "::error::workspace member ${m} is not in WINDOWS_RUSTDOC_CRATES" >&2
              missing=1
            fi
          done
          if [[ "${missing}" -ne 0 ]]; then
            exit 1
          fi
          printf 'Covered: %s\n' "${members[@]}"

      # Lints all workflows: expression and context typos, unknown keys, and
      # (via ShellCheck) the `run:` scripts, which YAML parsing alone never
      # checks. actionlint silently skips the shell checks when shellcheck is
      # not on PATH, and the runner image's shellcheck changes version under
      # us, so a pinned ShellCheck release is downloaded and passed explicitly
      # instead: the same checks run on every runner image, and a missing
      # binary fails the step rather than skipping the checks. Both releases
      # are pinned and their checksums verified, like the actions above.
      # Every download (here and in zizmor below) is HTTPS-only, redirects
      # included (--proto =https), with TLS 1.2 or newer. Each attempt is
      # capped (--connect-timeout, --max-time): a stalled release download
      # fails and is retried within minutes instead of holding the job until
      # its 30-minute timeout.
      # pyflakes is off: no step runs Python.
      # SHELLCHECK_OPTS turns on ShellCheck's optional checks (masked return
      # codes, `set -e` suppressed in functions, unassigned uppercase vars,
      # `[[ ]]` over `[ ]`, `${var}` over `$var`, useless `cat`, ...) for the
      # `run:` scripts. Every optional check of the pinned release is listed
      # and passes (`shellcheck --list-optional`); they are named rather than
      # `--enable=all` so bumping ShellCheck cannot add one unseen.
      # --norc: a `.shellcheckrc` (committed, or added by a PR) cannot
      # quietly disable checks or drop these optional ones; disabling a check
      # takes an inline `# shellcheck disable=` next to the code, in review.
      # -config-file /dev/null does the same for actionlint's own config: a
      # `.github/actionlint.yaml` (or .yml) can `ignore:` any error by regex,
      # which actionlint otherwise picks up silently.
      # actionlint only sees `run:` scripts, so the same ShellCheck (same
      # SHELLCHECK_OPTS, which ShellCheck reads itself) then lints the
      # standalone scripts too: the git hooks, any tracked *.sh / *.bash, and
      # any tracked text file whose first line is a sh/bash/dash/ksh shebang
      # (a script with no extension, e.g. under scripts/). The list comes
      # from git, so a script added later is checked without editing this
      # step; the step fails if the list is empty, rather than passing while
      # checking nothing. File names are NUL-delimited end to end, so no name
      # (spaces, newlines, a leading `-`) can split, glob or become a flag.
      - name: actionlint + ShellCheck
        env:
          SHELLCHECK_OPTS: >-
            --norc
            --enable=add-default-case,avoid-negated-conditions,avoid-nullary-conditions,check-extra-masked-returns,check-set-e-suppressed,check-unassigned-uppercase,deprecate-which,quote-safe-variables,require-double-brackets,require-variable-braces,useless-use-of-cat
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          cd "${RUNNER_TEMP}"
          sc_tarball="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -sSfL --proto =https --tlsv1.2 --retry 3 --connect-timeout 20 --max-time 300 -O "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${sc_tarball}"
          echo "${SHELLCHECK_SHA256}  ${sc_tarball}" | sha256sum -c -
          tar xJf "${sc_tarball}" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          shellcheck_bin="${RUNNER_TEMP}/shellcheck"
          "${shellcheck_bin}" --version
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL --proto =https --tlsv1.2 --retry 3 --connect-timeout 20 --max-time 300 -O "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar xzf "${tarball}" actionlint
          cd "${GITHUB_WORKSPACE}"
          "${RUNNER_TEMP}/actionlint" -color -config-file /dev/null -shellcheck="${shellcheck_bin}" -pyflakes=
          list="${RUNNER_TEMP}/shell-scripts"
          git ls-files -z -- '.githooks/*' '*.sh' '*.bash' > "${list}"
          # git grep exits 1 when nothing matches; any other failure stops.
          git grep -lzI -e '^#!' > "${list}.candidates" || [[ $? -eq 1 ]]
          shebang_re='^#![[:space:]]*(/usr)?/bin/(env[[:space:]]+)?(ba|da|k)?sh([[:space:]]|$)'
          while IFS= read -r -d '' f; do
            first_line="$(head -n 1 -- "${f}")"
            if [[ "${first_line}" =~ ${shebang_re} ]]; then
              printf '%s\0' "${f}" >> "${list}"
            fi
          done < "${list}.candidates"
          sort -zu -o "${list}" -- "${list}"
          mapfile -d '' -t script_list < "${list}"
          if [[ "${#script_list[@]}" -eq 0 ]]; then
            echo "::error::no shell scripts found to check" >&2
            exit 1
          fi
          printf 'ShellCheck: %s\n' "${script_list[@]}"
          "${shellcheck_bin}" -- "${script_list[@]}"

      # Security audit of the workflows, which actionlint does not do:
      # template injection in `run:` scripts, credentials persisted by
      # checkout, over-broad permissions, cache poisoning, unpinned actions.
      # With the job's read-only token it also checks online that each pinned
      # SHA really is a commit of the action's repository (impostor commits)
      # and that no pinned version has a known advisory. Pinned and
      # checksum-verified like actionlint; exits non-zero on any finding.
      # The auditor persona runs every audit at every confidence: the
      # code-quality ones the default persona hides (unnamed jobs, ...) and
      # the low-confidence ones pedantic still drops. Every one passes today.
      # --strict-collection fails on a workflow zizmor cannot parse, which it
      # otherwise only warns about and skips, auditing nothing in it.
      # --no-config: a `zizmor.yml` or `.github/zizmor.yml` (committed, or
      # added by a PR) cannot disable audits or loosen the pin policy unseen;
      # silencing a finding takes an inline `# zizmor: ignore[...]`, in review.
      - name: zizmor
        env:
          ZIZMOR_VERSION: 1.32.0
          ZIZMOR_SHA256: bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b
          GH_TOKEN: ${{ github.token }}
        run: |
          tarball="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          cd "${RUNNER_TEMP}"
          curl -sSfL --proto =https --tlsv1.2 --retry 3 --connect-timeout 20 --max-time 300 -O "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/${tarball}"
          echo "${ZIZMOR_SHA256}  ${tarball}" | sha256sum -c -
          tar xzf "${tarball}" zizmor
          cd "${GITHUB_WORKSPACE}"
          "${RUNNER_TEMP}/zizmor" --color=always --persona=auditor --strict-collection --no-config .github/workflows

      # Fast, needs no build: keep the clean packages clean. load_probe.rs is
      # checked by itself, since the rest of victory-loader is not clean yet.
      - name: rustfmt (clean packages)
        run: |
          read -r -a crates <<< "${RUSTFMT_CRATES}"
          cargo fmt --check "${crates[@]}"
          rustfmt --check --edition 2024 crates/victory-loader/tests/load_probe.rs

      - name: clippy (all targets)
        run: |
          read -r -a crates <<< "${LINUX_CRATES}"
          cargo clippy --all-targets --locked "${crates[@]}" -- -D warnings

      # The steps above build default features only, so code behind the
      # `diagnostics` (and victory-shader's `host`) features is never compiled.
      # Lint it too. Both builds stay: some code is cfg(not(feature = ...)).
      - name: clippy (all features)
        run: |
          read -r -a crates <<< "${LINUX_CRATES}"
          cargo clippy --all-targets --all-features --locked "${crates[@]}" -- -D warnings

      # Doc tests run under `cargo test` below, but rustdoc's own lints (a
      # renamed item leaving a dangling [`link`], a public doc linking to a
      # private item) only fire when the docs are built. Private items are
      # documented too, so their doc comments (most of the code's) are linted
      # as well; a public doc linking to a private item still fails. The
      # second run turns every feature on, so the doc comments on `diagnostics`
      # (and victory-shader's `host`) code are linted too.
      - name: rustdoc (clean crates)
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          read -r -a crates <<< "${RUSTDOC_CRATES}"
          cargo doc --no-deps --locked --document-private-items "${crates[@]}"
          cargo doc --no-deps --locked --document-private-items --all-features "${crates[@]}"

      # The skipped tests parse the test executable itself as a PE image, which
      # is an ELF on Linux. They still run on Windows. Once the workspace's
      # Linux gates land they are cfg(windows) and these --skip flags are no-ops.
      # --no-fail-fast: report failures from every test binary, not the first.
      # The second run turns every feature on, like the clippy and rustdoc
      # steps: `diagnostics` changes what some code does (victory-core's log
      # cap, victory-shader's loop limit read from the environment), so the
      # tests must pass with it too, not only compile.
      - name: cargo test
        run: |
          read -r -a crates <<< "${LINUX_CRATES}"
          skips=(
            --skip image::tests::parses_own_test_binary
            --skip image::tests::rva_to_file_offset_maps_entry_point
            --skip image::tests::rva_to_file_offset_rejects_offsets_past_4_gib
            --skip image::tests::rejects_iat_outside_image
            --skip prepare::tests::patches_own_test_binary
            --skip prepare::tests::keeps_iat_slots_when_import_size_excludes_the_terminator
            --skip prepare::tests::file_name_is_stable_per_build
          )
          cargo test --locked --no-fail-fast "${crates[@]}" -- --exact "${skips[@]}"
          cargo test --locked --no-fail-fast --all-features "${crates[@]}" -- --exact "${skips[@]}"

  # Type-checks the Windows build from Linux: no MSVC, no linking, nothing runs.
  # Catches compile errors in cfg(windows) code (most of victory-gpu,
  # victory-hle and apps/victory, and the Windows-only tests) that the job
  # above never compiles.
  windows-target-check:
    name: windows-target-check
    runs-on: ubuntu-24.04
    # checkout only.
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      # blake3's build script compiles C/assembly with MSVC tools for this
      # target. Its build script reads this variable to select the pure-Rust
      # implementation; nothing is linked here, so the choice has no effect.
      CARGO_FEATURE_PURE: "1"
      # rustc warnings (unused imports, dead code, ...) fail every step,
      # including the workspace-wide `cargo check` ones. Set for the whole job
      # so all steps share one build.
      # Dependencies are unaffected: cargo caps their lints.
      RUSTFLAGS: -D warnings
    steps:
      # Nothing here pushes; keep the token out of .git/config.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # rust-toolchain.toml already lists the x86_64-pc-windows-msvc target.
      # --no-self-update: as in the linux job.
      - name: Install pinned toolchain
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows-target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo check (workspace, all targets)
        run: cargo check --locked --workspace --all-targets --target x86_64-pc-windows-msvc

      - name: clippy (Windows target, clean crates)
        run: |
          read -r -a crates <<< "${WINDOWS_CLIPPY_CRATES}"
          cargo clippy --locked --all-targets --target x86_64-pc-windows-msvc "${crates[@]}" -- -D warnings

      # Same as the step above with every feature on, so the
      # `diagnostics` code (frame capture, the host debug layer, scripted keys,
      # mostly cfg(windows)) is compiled and linted too. Both builds stay: some
      # code is cfg(not(feature = "diagnostics")).
      - name: cargo check + clippy (Windows target, all features)
        run: |
          read -r -a crates <<< "${WINDOWS_CLIPPY_CRATES}"
          cargo check --locked --workspace --all-targets --all-features --target x86_64-pc-windows-msvc
          cargo clippy --locked --all-targets --all-features --target x86_64-pc-windows-msvc "${crates[@]}" -- -D warnings

      # The hle-probe fixture is outside the workspace (load_probe builds it on
      # demand on Windows), so the steps above never compile it. It is
      # Windows-only and needs no linker to check. It cannot inherit the
      # workspace lints, so its Cargo.toml repeats them (SAFETY comments etc.).
      - name: clippy (hle-probe fixture, Windows target)
        run: >
          cargo clippy --locked --all-targets --target x86_64-pc-windows-msvc
          --manifest-path tests/fixtures/hle-probe/Cargo.toml -- -D warnings

      # Same rustdoc lints as the Linux job (private items included), but for
      # the Windows-only code it never compiles, plus the hle-probe fixture.
      # Nothing is linked; RUSTFLAGS above is unchanged, so the dependency
      # builds are shared with the steps above. The all-features run covers
      # the docs on the `diagnostics` code, which is mostly cfg(windows).
      - name: rustdoc (Windows target, clean crates)
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          read -r -a crates <<< "${WINDOWS_RUSTDOC_CRATES}"
          cargo doc --no-deps --locked --document-private-items --target x86_64-pc-windows-msvc "${crates[@]}"
          cargo doc --no-deps --locked --document-private-items --all-features --target x86_64-pc-windows-msvc "${crates[@]}"
          cargo doc --no-deps --locked --document-private-items --target x86_64-pc-windows-msvc --manifest-path tests/fixtures/hle-probe/Cargo.toml

      # The fixture is outside the workspace, so `cargo fmt --all` never reaches
      # it. It is rustfmt-clean today; keep it that way. (The workspace itself
      # is not rustfmt-clean on main yet, so it is not checked here.)
      - name: rustfmt (hle-probe fixture)
        run: cargo fmt --check --manifest-path tests/fixtures/hle-probe/Cargo.toml
